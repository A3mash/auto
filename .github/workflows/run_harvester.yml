name: Automated Inventory Harvester Engine

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'تجربة بلا كتابة في القاعدة'
        type: boolean
        default: false
      store:
        description: 'معرّف متجر واحد (فارغ = كل المتاجر المفعّلة)'
        type: string
        default: ''
      include_inactive:
        description: 'اسمح بمتجر معطّل (للتجربة)'
        type: boolean
        default: false
      inspect_db:
        description: 'فحص القاعدة فقط (قراءة) بدل الحصاد'
        type: boolean
        default: false

concurrency:
  group: harvester
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Clone Repository Data
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Offline tests
      run: python -m unittest discover -s tests -v

    - name: Inspect Database (read-only)
      if: ${{ inputs.inspect_db }}
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python -u inspect_db.py

    - name: Execute Harvesting Engine
      if: ${{ !inputs.inspect_db }}
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        STORE: ${{ inputs.store && format('--store {0}', inputs.store) || '' }}
        INACTIVE: ${{ inputs.include_inactive && '--include-inactive' || '' }}
      run: python -u harvester.py $DRY_RUN $STORE $INACTIVE
